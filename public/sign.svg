<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Background to match the off-white/greyish wall -->
  <rect width="100%" height="100%" fill="#eaeaea" />

  <!-- Drawing Group -->
  <g fill="none" stroke="#086638" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main vertical line -->
    <path d="M85 45 C95 180, 80 300, 82 470" stroke-width="9" />
    
    <!-- Second line interwoven with the vertical to simulate marker thickness and texture -->
    <path d="M85 45 C80 180, 95 300, 90 470" stroke-width="6" />
    
    <!-- The distinct bulge/extra stroke near the bottom intersection of the vertical line -->
    <path d="M90 280 C110 330, 115 370, 115 390 C115 400, 125 410, 110 415" stroke-width="8" />

    <!-- Short stroke extending near the bottom-left of the intersection -->
    <path d="M75 390 L75 470" stroke-width="5" />

    <!-- Long horizontal line spanning left to right -->
    <path d="M45 425 Q 220 412 375 410" stroke-width="9" />

    <!-- Small stray curved mark on the bottom right -->
    <path d="M310 435 Q 320 425 330 435" stroke-width="5" />
  </g>
</svg>
