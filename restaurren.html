.sparkline path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 1.5s ease-out forwards; }

function $$(s, p=document) { return Array.from(p.querySelectorAll(s)); }

function navigate(page) {
  state.currentPage = page;
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));

  $('.sidebar')?.classList.remove('open');

}

function toast(msg, type='success') {
  const colors = { success: {bg:'rgba(74,222,128,0.12)', bd:'rgba(74,222,128,0.4)', ic:'check-circle', c:'#4ade80'}, error: {bg:'rgba(248,113,113,0.12)', bd:'rgba(248,113,113,0.4)', ic:'x-circle', c:'#f87171'}, info: {bg:'rgba(96,165,250,0.12)', bd:'rgba(96,165,250,0.4)', ic:'info', c:'#60a5fa'} };
  const c = colors[type];
  const el = document.createElement('div');
  el.className = 'toast flex items-center gap-3 px-4 py-3 rounded-xl border';
  el.style.cssText = `background:${c.bg};border-color:${c.bd};color:${c.c};backdrop-filter:blur(20px);min-width:240px;`;
  el.innerHTML = `<i data-lucide="${c.ic}" class="w-4 h-4"></i><span class="text-sm font-medium text-white">${msg}</span>`;
  $('#toastContainer').appendChild(el);
  if (window.lucide) lucide.createIcons();
  setTimeout(() => { el.style.transition='all 0.3s'; el.style.opacity='0'; el.style.transform='translateY(20px)'; setTimeout(()=>el.remove(), 300); }, 2800);
}

function animateNumber(el, target, duration=1200, prefix='', suffix='') {
  const startTime = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = target * eased;
    el.textContent = prefix + (Number.isInteger(target) ? Math.round(val) : val.toFixed(2)) + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function statusBadge(s) {
  const map = { pending:'Pending', confirmed:'Confirmed', preparing:'Preparing', ready:'Ready', served:'Served', paid:'Paid', cancelled:'Cancelled' };
  return `<span class="badge badge-${s}">${map[s]}</span>`;
}

function sparkPath(values) {
  const max = Math.max(...values), min = Math.min(...values);
  const range = max - min || 1;
  return 'M' + values.map((v, i) => `${(i/(values.length-1))*100},${40-((v-min)/range)*35-2}`).join(' L');
}

window.addToPOS = function(id) {
  const item = state.menu.items.find(i => i.id === id);
  const ex = state.posCart.find(x => x.id === id);
  if (ex) ex.qty++; else state.posCart.push({ id, qty:1, name:item.name, price:item.price, gradient:item.gradient });
  updatePOSCart();
  toast(`${item.name} added`, 'success');
};
window.removeFromPOS = function(id) {
  const it = state.posCart.find(x => x.id === id);
  if (it) { it.qty--; if (it.qty<=0) state.posCart = state.posCart.filter(x => x.id !== id); }
  updatePOSCart();
};
window.clearPOS = function() { state.posCart = []; updatePOSCart(); toast('Cart cleared', 'info'); };
window.applyPOSDisc = function() { if (!state.posCart.length) return toast('Cart is empty','error'); toast('10% discount applied','success'); updatePOSCart(true); };
window.splitPOS = function() {
  if (!state.posCart.length) return toast('Cart is empty','error');
  showModal(`<h3 class="font-display font-bold text-xl mb-2">Split the Bill</h3><p class="text-sm text-[var(--muted)] mb-4">Divide equally between guests</p><div class="grid grid-cols-3 gap-2 mb-4">${[2,3,4,5,6,8].map(n=>`<button class="split-btn p-3 rounded-xl border border-[var(--border)] hover:border-[var(--accent)] text-lg font-bold" data-n="${n}">${n}</button>`).join('')}</div><div class="text-xs text-[var(--muted)] text-center">Select number of guests</div>`);
  $$('.split-btn').forEach(b => b.addEventListener('click', () => {
    const total = state.posCart.reduce((s,i) => s+i.price*i.qty, 0);
    closeModal(); toast(`Split into ${b.dataset.n} ways: ${fmt(total/parseInt(b.dataset.n))} each`, 'success');
  }));
};
window.checkoutPOS = function() {
  if (!state.posCart.length) return toast('Cart is empty','error');
  if (!state.posTable) return toast('Select a table first','error');
  const total = state.posCart.reduce((s,i) => s+i.price*i.qty, 0) * 1.085;
  showModal(`
    <h3 class="font-display font-bold text-xl mb-1">Payment</h3>
    <p class="text-sm text-[var(--muted)] mb-4">Table ${state.posTable} · ${state.posCart.reduce((s,i)=>s+i.qty,0)} items</p>
    <div class="text-center py-6 rounded-xl mb-4" style="background:rgba(255,107,53,0.05);"><div class="text-xs text-[var(--muted)] uppercase tracking-wider">Amount Due</div><div class="font-display font-black text-4xl mt-1" style="background:linear-gradient(135deg,#ff6b35,#ffa552);-webkit-background-clip:text;background-clip:text;color:transparent;">${fmt(total)}</div></div>
    <div class="grid grid-cols-3 gap-2 mb-4">
      <button class="pay-btn p-3 rounded-xl border border-[var(--border)] hover:border-[var(--accent)] text-sm font-semibold flex flex-col items-center gap-1" data-method="cash"><i data-lucide="banknote" class="w-5 h-5 text-[var(--success)]"></i> Cash</button>
      <button class="pay-btn p-3 rounded-xl border border-[var(--border)] hover:border-[var(--accent)] text-sm font-semibold flex flex-col items-center gap-1" data-method="card"><i data-lucide="credit-card" class="w-5 h-5 text-[var(--info)]"></i> Card</button>
      <button class="pay-btn p-3 rounded-xl border border-[var(--border)] hover:border-[var(--accent)] text-sm font-semibold flex flex-col items-center gap-1" data-method="upi"><i data-lucide="smartphone" class="w-5 h-5 text-[var(--purple)]"></i> UPI</button>
    </div>
    <button class="btn-ghost w-full text-sm" onclick="closeModal()">Cancel</button>
  `);
  $$('.pay-btn').forEach(b => b.addEventListener('click', () => {
    closeModal(); state.posCart = []; state.posTable = null; updatePOSCart();
    $('#posTableDisplay').textContent = 'No table selected';
    toast('Payment successful · Receipt printed', 'success');
  }));
};

function updatePOSCart(discount=false) {
  const cartEl = $('#posCart'); const totalsEl = $('#posTotals');
  if (!cartEl) return;
  if (!state.posCart.length) {
    cartEl.innerHTML = `<div class="text-center text-[var(--muted)] text-sm py-8"><i data-lucide="shopping-cart" class="w-8 h-8 mx-auto mb-2 opacity-30"></i><div>Tap menu items to add</div></div>`;
    totalsEl.classList.add('hidden');
    if (window.lucide) lucide.createIcons();
    return;
  }
  let sub = state.posCart.reduce((s,i) => s+i.price*i.qty, 0);
  if (discount) sub *= 0.9;
  const tax = sub * 0.085;
  cartEl.innerHTML = state.posCart.map(i => `
    <div class="flex items-center gap-2 p-2.5 rounded-lg" style="background:rgba(255,180,120,0.03);">
      <div class="w-10 h-10 rounded-md bg-gradient-to-br ${i.gradient}"></div>
      <div class="flex-1 min-w-0"><div class="text-xs font-semibold truncate">${i.name}</div><div class="text-[10px] text-[var(--muted)]">${fmt(i.price)} each</div></div>
      <div class="flex items-center gap-1.5">
        <button class="w-5 h-5 rounded-md flex items-center justify-center text-xs" style="background:rgba(255,180,120,0.08);" onclick="removeFromPOS('${i.id}')">−</button>
        <span class="text-xs font-bold w-5 text-center">${i.qty}</span>
        <button class="w-5 h-5 rounded-md flex items-center justify-center text-xs" style="background:rgba(255,180,120,0.08);" onclick="addToPOS('${i.id}')">+</button>
      </div>
      <div class="text-xs font-bold ml-1 w-12 text-right">${fmt(i.price*i.qty)}</div>
    </div>
  `).join('');
  totalsEl.classList.remove('hidden');
  $('#posSubtotal').textContent = fmt(sub);
  $('#posTax').textContent = fmt(tax);
  $('#posTotal').textContent = fmt(sub+tax);
  if (window.lucide) lucide.createIcons();
}

function kdsCard(o) {
  const mins = o.elapsed;
  const color = mins > 20 ? 'var(--danger)' : mins > 10 ? 'var(--warning)' : 'var(--success)';
  return `<div class="kds-card ${mins>20?'urgent':''}" style="border-left:3px solid ${color};">
    <div class="flex items-start justify-between mb-2">
      <div><div class="font-display font-bold text-base">${o.table}</div><div class="font-mono text-[10px] text-[var(--muted)]">${o.id}</div></div>
      <div class="text-right"><div class="font-mono font-bold text-sm" style="color:${color};">${mins}m</div><div class="text-[9px] text-[var(--muted)] uppercase">elapsed</div></div>
    </div>
    <div class="space-y-1 mb-3">
      ${Array.from({length:o.items}, (_,i) => {
        const item = state.menu.items[(i+o.id.length)%state.menu.items.length];
        return `<div class="flex items-center gap-2 text-xs"><span class="font-bold text-[var(--accent-2)]">1×</span><span class="flex-1">${item.name}</span>${item.spicy?'<span class="text-[var(--danger)]">🌶</span>':''}</div>`;
      }).join('')}
    </div>
    <div class="flex gap-1.5">
      ${o.status==='pending'?`<button class="flex-1 text-[11px] font-semibold py-1.5 rounded-md btn-primary" onclick="advanceOrder('${o.id}','preparing')">Start</button>`:''}
      ${o.status==='preparing'?`<button class="flex-1 text-[11px] font-semibold py-1.5 rounded-md" style="background:rgba(74,222,128,0.15);color:var(--success);" onclick="advanceOrder('${o.id}','ready')">Mark Ready</button>`:''}

  </div>`;
}

      ${t.status !== 'occupied' ? `<button class="btn-ghost text-sm py-2" onclick="changeTableStatus('${t.id}','occupied')"><i data-lucide="utensils" class="w-4 h-4 inline mr-1"></i> Mark Occupied</button>` : ''}
      ${t.status !== 'reserved' ? `<button class="btn-ghost text-sm py-2" onclick="changeTableStatus('${t.id}','reserved')"><i data-lucide="calendar-clock" class="w-4 h-4 inline mr-1"></i> Mark Reserved</button>` : ''}
      ${t.status !== 'cleaning' ? `<button class="btn-ghost text-sm py-2" onclick="changeTableStatus('${t.id}','cleaning')"><i data-lucide="sparkles" class="w-4 h-4 inline mr-1"></i> Mark Cleaning</button>` : ''}

window.changeTableStatus = function(id, status) {

// ============= CUSTOMER VIEW (PREVIEW) =============
 $('#previewMenuBtn').addEventListener('click', openCustomerView);

function openCustomerView() {
  const ov = $('#customerOverlay');
  ov.classList.remove('hidden');
  ov.innerHTML = `
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm modal-backdrop" onclick="closeCustomerView()"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md glass-strong overflow-y-auto no-scrollbar modal-content" style="border-left:1px solid var(--border-strong);" onclick="event.stopPropagation()">
      <div class="relative h-40 bg-gradient-to-br from-orange-600 to-red-700 flex-shrink-0">
        <button class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/40 flex items-center justify-center" onclick="closeCustomerView()"><i data-lucide="x" class="w-4 h-4"></i></button>
        <div class="absolute bottom-4 left-4">
          <div class="text-[10px] uppercase tracking-widest text-white/70">Welcome to</div>
          <div class="font-display font-black text-3xl text-white">Saffron & Smoke</div>
          <div class="text-xs text-white/80 mt-1">Table T05 · 4 guests</div>
        </div>
      </div>
      <div class="sticky top-0 z-10 glass-strong p-3 flex gap-2 overflow-x-auto no-scrollbar border-b border-[var(--border)]">
        ${state.menu.categories.map((c,i) => `<button class="tab-btn ${i===0?'active':''}" data-ccat="${c.id}">${c.name}</button>`).join('')}
      </div>
      <div id="customerMenuList" class="p-4 space-y-3"></div>
      <div id="customerCart" class="sticky bottom-0 left-0 right-0 p-4 glass-strong border-t border-[var(--border-strong)] hidden">
        <div class="flex items-center justify-between mb-2"><span class="text-sm font-semibold">Order Total</span><span class="font-display font-bold text-lg" id="custTotal">$0.00</span></div>
        <button class="btn-primary w-full text-sm" onclick="placeCustomerOrder()">Place Order</button>
      </div>
    </div>
  `;
  renderCustomerMenu('c1');
  $$('[data-ccat]', ov).forEach(b => b.addEventListener('click', () => {
    $$('[data-ccat]', ov).forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    renderCustomerMenu(b.dataset.ccat);
  }));
  if(window.lucide) lucide.createIcons();
}

window.closeCustomerView = function() { $('#customerOverlay').classList.add('hidden'); $('#customerOverlay').innerHTML=''; state.cart = []; };

function renderCustomerMenu(catId) {
  const items = state.menu.items.filter(i => i.categoryId === catId && i.available);
  $('#customerMenuList').innerHTML = items.map(i => `
    <div class="flex gap-3 p-3 rounded-xl border border-[var(--border)] hover:border-[var(--border-strong)] transition">
      <div class="w-16 h-16 rounded-lg bg-gradient-to-br ${i.gradient} flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div><div class="font-semibold text-sm">${i.name}</div><div class="text-[10px] text-[var(--muted)] mt-0.5">${i.prepTime} min</div></div>
          <div class="font-display font-bold text-sm text-[var(--accent-2)]">${fmt(i.price)}</div>
        </div>
        <p class="text-xs text-[var(--muted)] mt-1 line-clamp-2">${i.desc}</p>
        <button class="mt-2 text-xs font-semibold text-[var(--accent)] flex items-center gap-1" onclick="addToCustomerCart('${i.id}')"><i data-lucide="plus-circle" class="w-3 h-3"></i> Add to order</button>
      </div>
    </div>
  `).join('');
  if(window.lucide) lucide.createIcons();
}

window.addToCustomerCart = function(id) {
  const item = state.menu.items.find(i => i.id === id);
  const ex = state.cart.find(x => x.id === id);
  if (ex) ex.qty++; else state.cart.push({ id, qty:1, price:item.price, name:item.name });
  updateCustomerCart();
  toast(`${item.name} added`, 'success');
};

window.placeCustomerOrder = function() {
  if (!state.cart.length) return;
  closeCustomerView();
  toast('Order placed! Kitchen notified.', 'success');
};

function updateCustomerCart() {
  const cartEl = $('#customerCart');
  if (!cartEl) return;
  if (!state.cart.length) { cartEl.classList.add('hidden'); return; }
  cartEl.classList.remove('hidden');
  const total = state.cart.reduce((s,i) => s+i.price*i.qty, 0);
  $('#custTotal').textContent = fmt(total);
}

// ============= MODAL & INIT =============
function showModal(html) {
  const m = document.createElement('div');
  m.id = 'activeModal';
  m.className = 'fixed inset-0 z-[90] flex items-center justify-center p-4';
  m.innerHTML = `<div class="absolute inset-0 bg-black/70 backdrop-blur-sm modal-backdrop" onclick="closeModal()"></div><div class="relative glass-strong rounded-2xl p-6 w-full max-w-md modal-content">${html}</div>`;
  document.body.appendChild(m);
  if(window.lucide) lucide.createIcons();
}
window.closeModal = function() { $('#activeModal')?.remove(); };

// Initial render
navigate('dashboard');
if (window.lucide) lucide.createIcons();

// Simulate live updates on KDS and Dashboard
setInterval(() => {
  if (state.currentPage === 'kds' || state.currentPage === 'orders' || state.currentPage === 'dashboard') {
    const pending = state.orders.find(o => o.status === 'pending');
    if (pending && Math.random() > 0.7) {
      pending.elapsed += 1;
      if (state.currentPage === 'kds') renderKDS($('#pageContainer'));
    }
  }
}, 5000);
</script>
