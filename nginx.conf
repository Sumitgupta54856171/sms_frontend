server {
    listen 80;
    server_name localhost;

    # Frontend folder path inside Docker
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # 1. OPTIMIZATION (Gzip & Cache)
    # ==========================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # 2. BACKEND API PROXY (Fixes 405 Error)
    # ==========================================
    location /api/ {
        proxy_pass http://100.112.25.69:8080/api/;
        
        # Security & Tracking Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 3. PHOTO/FILE UPLOADS PROXY (Fixes Image Issue)
    # ==========================================
    location /uploads/ {
        proxy_pass http://100.112.25.69:8080/uploads/;

        # Optional: Add cache headers if photos don't change often
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================
    # 4. REACT ROUTER FALLBACK (For SPA)
    # ==========================================
    # Yeh sabse last mein hona chahiye. Agar Nginx ko file nahi milti (na api, na upload), 
    # toh woh request React (index.html) ko bhej dega.
    location / {
        try_files $uri $uri/ /index.html;
    }
}