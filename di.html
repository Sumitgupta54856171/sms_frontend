<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Academy — Shaping Tomorrow</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & Framer Motion -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
    
    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        'lux-gold': '#D4AF37',
                        'royal-blue': '#1e3a8a',
                        'aurora-purple': '#6d28d9',
                        'emerald-glow': '#10b981',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-light: #f8fafc;
            --text-light: #0f172a;
            --bg-dark: #050714;
            --text-dark: #e2e8f0;
        }

        * {
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        html.light body {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        /* Aurora Background */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            opacity: 0.4;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Custom Cursor */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(109,40,217,0.15) 0%, rgba(5,7,20,0) 70%);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
            mix-blend-mode: screen;
        }

        html.light .cursor-glow {
            background: radial-gradient(circle, rgba(30,58,138,0.1) 0%, rgba(248,250,252,0) 70%);
            mix-blend-mode: multiply;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        html.light .glass {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #8b9db0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        html.light .text-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #475569 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #FDB931 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(109,40,217,0.5); border-radius: 4px; }
        
        /* Magnetic Button Base */
        .magnetic-btn { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Hide default cursor on interactive elements when custom cursor is active */
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
            a, button, input, textarea { cursor: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, useScroll, useTransform, useInView, AnimatePresence } = window.framerMotion || window.Motion;

        // Custom Cursor Component
        const CursorGlow = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            
            useEffect(() => {
                const move = (e) => setPos({ x: e.clientX, y: e.clientY });
                window.addEventListener('mousemove', move);
                return () => window.removeEventListener('mousemove', move);
            }, []);

            return (
                <div 
                    className="cursor-glow hidden md:block" 
                    style={{ left: pos.x, top: pos.y }}
                />
            );
        };

        // Magnetic Button Component
        const MagneticButton = ({ children, className, primary, onClick }) => {
            const ref = useRef(null);
            const [pos, setPos] = useState({ x: 0, y: 0 });

            const handleMouse = (e) => {
                const rect = ref.current.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                setPos({ x: x * 0.3, y: y * 0.3 });
            };

            const handleLeave = () => setPos({ x: 0, y: 0 });

            return (
                <motion.button
                    ref={ref}
                    onMouseMove={handleMouse}
                    onMouseLeave={handleLeave}
                    animate={{ x: pos.x, y: pos.y }}
                    transition={{ type: "spring", stiffness: 150, damping: 15, mass: 0.1 }}
                    onClick={onClick}
                    className={`px-8 py-4 rounded-full font-display font-medium text-sm tracking-wide transition-colors duration-300 ${className} ${
                        primary 
                            ? 'bg-lux-gold text-black hover:bg-white' 
                            : 'glass text-current hover:border-lux-gold/50'
                    }`}
                >
                    {children}
                </motion.button>
            );
        };

        // Reveal Text Animation
        const RevealText = ({ children, delay = 0, className = "" }) => (
            <motion.div
                initial={{ opacity: 0, y: 40 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true, margin: "-100px" }}
                transition={{ duration: 0.8, delay, ease: [0.16, 1, 0.3, 1] }}
                className={className}
            >
                {children}
            </motion.div>
        );

        // Navbar Component
        const Navbar = ({ darkMode, toggleDark }) => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', onScroll);
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            return (
                <motion.nav 
                    initial={{ y: -100, opacity: 0 }}
                    animate={{ y: 0, opacity: 1 }}
                    transition={{ duration: 1, delay: 0.5, ease: [0.16, 1, 0.3, 1] }}
                    className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full flex items-center gap-8 transition-all duration-500 ${
                        scrolled ? 'glass shadow-2xl' : 'bg-transparent border border-transparent'
                    }`}
                    style={{ width: '90%', maxWidth: '1100px' }}
                >
                    <div className="font-display text-xl font-bold tracking-tight">
                        LUMINA<span className="text-lux-gold">.</span>
                    </div>
                    <div className="hidden md:flex items-center gap-5 text-sm font-medium opacity-80 ml-auto">
                        <a href="#academics" className="hover:text-lux-gold transition-colors">Academics</a>
                        <a href="#calendar" className="hover:text-lux-gold transition-colors">Calendar</a>
                        <a href="#staff" className="hover:text-lux-gold transition-colors">Staff</a>
                        <a href="#fees" className="hover:text-lux-gold transition-colors">Fees</a>
                        <a href="#facilities" className="hover:text-lux-gold transition-colors">Facilities</a>
                        <a href="#results" className="hover:text-lux-gold transition-colors">Results</a>
                        <a href="#faq" className="hover:text-lux-gold transition-colors">FAQ</a>
                    </div>
                    <div className="ml-auto md:ml-0 flex items-center gap-4">
                        <button onClick={toggleDark} className="p-2 rounded-full hover:bg-white/10 transition-colors">
                            {darkMode ? '☀️' : '🌙'}
                        </button>
                        <MagneticButton primary className="hidden md:block !py-2 !px-5 !text-xs">Apply Now</MagneticButton>
                    </div>
                </motion.nav>
            );
        };

        // Hero Section
        const Hero = () => {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            
            useEffect(() => {
                const handleMouse = (e) => {
                    setMousePos({
                        x: (e.clientX / window.innerWidth - 0.5) * 2,
                        y: (e.clientY / window.innerHeight - 0.5) * 2,
                    });
                };
                window.addEventListener('mousemove', handleMouse);
                return () => window.removeEventListener('mousemove', handleMouse);
            }, []);

            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden pt-20">
                    {/* Video Background */}
                    <div className="absolute inset-0 w-full h-full z-0 overflow-hidden">
                        <video
                            autoPlay
                            muted
                            loop
                            playsInline
                            poster="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=2000&auto=format&fit=crop"
                            className="absolute inset-0 w-full h-full object-cover"
                        >
                            <source src="https://cdn.coverr.co/videos/coverr-students-walking-on-campus-5692/1080p.mp4" type="video/mp4" />
                        </video>
                        {/* Dark Overlay */}
                        <div className="absolute inset-0 bg-gradient-to-b from-black/70 via-black/50 to-black/80"></div>
                    </div>

                    <div className="relative z-10 text-center px-6 max-w-6xl mx-auto">
                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1, delay: 0.8 }}
                            className="inline-block mb-8 px-4 py-1.5 rounded-full glass text-xs font-medium tracking-widest uppercase"
                        >
                            <span className="text-lux-gold">●</span> Accepting Applications for 2025-2026
                        </motion.div>

                        <h1 className="font-display text-5xl md:text-8xl lg:text-9xl font-bold leading-[0.9] tracking-tighter mb-8">
                            <motion.span 
                                initial={{ opacity: 0, y: 50 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 1, delay: 1, ease: [0.16, 1, 0.3, 1] }}
                                className="block text-gradient"
                            >
                                Shaping The
                            </motion.span>
                            <motion.span 
                                initial={{ opacity: 0, y: 50 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 1, delay: 1.2, ease: [0.16, 1, 0.3, 1] }}
                                className="block text-gold-gradient italic font-light"
                            >
                                Architects
                            </motion.span>
                            <motion.span 
                                initial={{ opacity: 0, y: 50 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 1, delay: 1.4, ease: [0.16, 1, 0.3, 1] }}
                                className="block text-gradient"
                            >
                                of Tomorrow.
                            </motion.span>
                        </h1>

                        <motion.p 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ duration: 1, delay: 1.6 }}
                            className="text-lg md:text-xl opacity-70 max-w-2xl mx-auto mb-10 font-light"
                        >
                            An ecosystem of academic brilliance, futuristic technology, and global leadership. Where extraordinary minds become legends.
                        </motion.p>

                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1, delay: 1.8 }}
                            className="flex flex-col sm:flex-row gap-4 justify-center"
                        >
                            <MagneticButton primary>Begin Your Journey</MagneticButton>
                            <MagneticButton>Watch Campus Film</MagneticButton>
                        </motion.div>

                        {/* Floating Glass Stats Cards */}
                        <motion.div 
                            initial={{ opacity: 0, y: 50 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1, delay: 2 }}
                            className="absolute inset-0 hidden lg:flex justify-between items-end pointer-events-none"
                            style={{
                                transform: `translateX(${mousePos.x * -10}px) translateY(${mousePos.y * -10}px)`
                            }}
                        >
                            <div className="glass p-6 rounded-2xl w-64 mb-20 pointer-events-auto" style={{transform: `translateY(${mousePos.y * 15}px)`}}>
                                <div className="text-3xl font-bold text-lux-gold font-display">150+</div>
                                <div className="text-sm opacity-60 mt-1">Years of Educational Legacy</div>
                            </div>
                            <div className="glass p-6 rounded-2xl w-64 mb-40 pointer-events-auto" style={{transform: `translateY(${mousePos.x * -15}px)`}}>
                                <div className="text-3xl font-bold text-emerald-glow font-display">98%</div>
                                <div className="text-sm opacity-60 mt-1">Ivy League University Placements</div>
                            </div>
                        </motion.div>
                    </div>
                    
                    <motion.div 
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        transition={{ delay: 2.5 }}
                        className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-xs opacity-50"
                    >
                        <span>SCROLL TO EXPLORE</span>
                        <div className="w-px h-10 bg-gradient-to-b from-white/50 to-transparent"></div>
                    </motion.div>
                </section>
            );
        };

        // 3D Tilt Card Component
        const TiltCard = ({ children, className }) => {
            const ref = useRef(null);
            const [rotate, setRotate] = useState({ x: 0, y: 0 });

            const handleMouse = (e) => {
                if (!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                setRotate({ x: y * 10, y: x * -10 });
            };

            return (
                <motion.div
                    ref={ref}
                    onMouseMove={handleMouse}
                    onMouseLeave={() => setRotate({ x: 0, y: 0 })}
                    style={{ rotateX: rotate.x, rotateY: rotate.y, transformPerspective: 1000 }}
                    transition={{ type: "spring", stiffness: 200, damping: 20 }}
                    className={`glass rounded-3xl p-8 transition-shadow duration-300 hover:shadow-[0_20px_80px_-20px_rgba(109,40,217,0.3)] ${className}`}
                >
                    {children}
                </motion.div>
            );
        };

        // Generic Section Header
        const SectionHeader = ({ tag, title, subtitle }) => (
            <div className="max-w-3xl mb-20">
                <RevealText>
                    <span className="text-lux-gold text-sm font-medium tracking-widest uppercase">{tag}</span>
                </RevealText>
                <RevealText delay={0.1}>
                    <h2 className="font-display text-4xl md:text-6xl font-bold tracking-tighter mt-4 text-gradient">{title}</h2>
                </RevealText>
                <RevealText delay={0.2}>
                    <p className="text-lg opacity-60 mt-6 font-light leading-relaxed">{subtitle}</p>
                </RevealText>
            </div>
        );

        // Programs Section
        const Programs = () => {
            const programs = [
                { title: "Sciences & Research", desc: "State-of-the-art laboratories and quantum computing access.", icon: "🧬", color: "from-blue-500 to-indigo-500" },
                { title: "Global Leadership", desc: "UN-model simulations and international policy incubators.", icon: "🌍", color: "from-emerald-500 to-teal-500" },
                { title: "Creative Arts", desc: "World-class studios for film, architecture, and digital design.", icon: "🎨", color: "from-amber-500 to-orange-500" },
                { title: "Future Technology", desc: "AI, robotics, and neural engineering specialization tracks.", icon: "🚀", color: "from-purple-500 to-fuchsia-500" },
            ];

            return (
                <section id="academics" className="relative py-32 px-6 max-w-7xl mx-auto">
                    <SectionHeader 
                        tag="Academic Excellence" 
                        title="Curriculum Beyond Boundaries" 
                        subtitle="A bespoke educational model designed to cultivate genius, foster innovation, and prepare students for a world that doesn't exist yet." 
                    />
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {programs.map((p, i) => (
                            <RevealText key={i} delay={i * 0.1}>
                                <TiltCard className="h-full group">
                                    <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${p.color} flex items-center justify-center text-2xl mb-6 group-hover:scale-110 transition-transform duration-300`}>
                                        {p.icon}
                                    </div>
                                    <h3 className="font-display text-xl font-semibold mb-3">{p.title}</h3>
                                    <p className="text-sm opacity-60 leading-relaxed">{p.desc}</p>
                                </TiltCard>
                            </RevealText>
                        ))}
                    </div>
                </section>
            );
        };

        // Campus Parallax Section
        const Campus = () => {
            const { scrollYProgress } = useScroll();
            const y1 = useTransform(scrollYProgress, [0, 1], ["0%", "50%"]);
            const y2 = useTransform(scrollYProgress, [0, 1], ["0%", "-50%"]);

            return (
                <section id="campus" className="relative py-32 px-6">
                    <div className="max-w-7xl mx-auto">
                        <SectionHeader 
                            tag="The Campus Experience" 
                            title="An Environment Built for Geniuses" 
                            subtitle="Immerse yourself in a 500-acre sanctuary of learning, featuring futuristic architecture and nature-integrated spaces." 
                        />
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 h-[60vh] overflow-hidden">
                            <motion.div style={{ y: y1 }} className="h-full rounded-3xl overflow-hidden glass">
                                <img src="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover" alt="Campus 1" />
                            </motion.div>
                            <motion.div style={{ y: y2 }} className="h-full rounded-3xl overflow-hidden glass">
                                <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover" alt="Campus 2" />
                            </motion.div>
                            <motion.div style={{ y: y1 }} className="h-full rounded-3xl overflow-hidden glass">
                                <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover" alt="Campus 3" />
                            </motion.div>
                        </div>
                    </div>
                </section>
            );
        };

        // Admissions Process
        const Admissions = () => {
            const steps = [
                { num: "01", title: "Inquiry & Tour", desc: "Schedule a private consultation and immersive campus visit." },
                { num: "02", title: "Application Submission", desc: "Submit transcripts, recommendations, and a personal manifesto." },
                { num: "03", title: "Assessment & Interview", desc: "Participate in an interactive cognitive and character assessment." },
                { num: "04", title: "Enrollment & Welcome", desc: "Receive your acceptance and join the Lumina cohort." },
            ];

            return (
                <section id="admissions" className="relative py-32 px-6 max-w-7xl mx-auto">
                    <SectionHeader 
                        tag="Admissions" 
                        title="Your Path to Excellence" 
                        subtitle="A streamlined, personalized process designed to identify the brightest minds and future leaders." 
                    />
                    <div className="relative">
                        <div className="absolute left-0 top-0 bottom-0 w-px bg-gradient-to-b from-lux-gold via-aurora-purple to-transparent hidden md:block ml-[1.5rem]"></div>
                        <div className="flex flex-col gap-12">
                            {steps.map((step, i) => (
                                <RevealText key={i} delay={i * 0.1}>
                                    <div className="flex items-start gap-8 group">
                                        <div className="w-12 h-12 rounded-full glass border border-lux-gold/50 flex items-center justify-center font-display text-lux-gold font-bold text-sm flex-shrink-0 group-hover:scale-110 group-hover:bg-lux-gold group-hover:text-black transition-all duration-300">
                                            {step.num}
                                        </div>
                                        <div className="pt-2">
                                            <h3 className="text-2xl font-display font-semibold mb-2">{step.title}</h3>
                                            <p className="opacity-60 max-w-xl">{step.desc}</p>
                                        </div>
                                    </div>
                                </RevealText>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // FAQ Accordion
        const FAQ = () => {
            const [open, setOpen] = useState(0);
            const faqs = [
                { q: "What is the student-to-teacher ratio?", a: "We maintain an intimate 5:1 student-to-teacher ratio, ensuring personalized mentorship and unparalleled academic support for every student." },
                { q: "Does Lumina offer financial aid?", a: "Yes, we are committed to need-blind admissions. Over 40% of our students receive substantial financial aid packages tailored to their family's circumstances." },
                { q: "What technology is integrated into the curriculum?", a: "Our campus is a living laboratory. Students have access to quantum computing clusters, VR/AR design suites, and proprietary AI learning assistants." },
            ];

            return (
                <section id="faq" className="relative py-32 px-6 max-w-4xl mx-auto">
                    <SectionHeader 
                        tag="Frequently Asked" 
                        title="Questions, Answered." 
                        subtitle="Everything you need to know about life and learning at Lumina Academy." 
                    />
                    <div className="flex flex-col gap-4">
                        {faqs.map((faq, i) => (
                            <RevealText key={i} delay={i * 0.1}>
                                <div className={`glass rounded-2xl overflow-hidden transition-colors duration-300 ${open === i ? 'border-lux-gold/30' : ''}`}>
                                    <button 
                                        onClick={() => setOpen(open === i ? -1 : i)}
                                        className="w-full text-left p-6 flex justify-between items-center"
                                    >
                                        <span className="font-display text-lg font-medium">{faq.q}</span>
                                        <motion.span animate={{ rotate: open === i ? 45 : 0 }} className="text-lux-gold text-2xl font-light">+</motion.span>
                                    </button>
                                    <AnimatePresence initial={false}>
                                        {open === i && (
                                            <motion.div
                                                initial={{ height: 0, opacity: 0 }}
                                                animate={{ height: "auto", opacity: 1 }}
                                                exit={{ height: 0, opacity: 0 }}
                                                transition={{ duration: 0.4, ease: [0.16, 1, 0.3, 1] }}
                                                className="overflow-hidden"
                                            >
                                                <p className="px-6 pb-6 opacity-70 leading-relaxed">{faq.a}</p>
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </div>
                            </RevealText>
                        ))}
                    </div>
                </section>
            );
        };

        // ─── Academic Calendar Section ─────────────────────────────────────
        const AcademicCalendar = () => {
            const months = [
                { month: "April", events: "New Academic Session Begins" },
                { month: "May", events: "Summer Break / PTM" },
                { month: "June", events: "School Reopens / Unit Test 1" },
                { month: "July", events: "Sports & Cultural Events" },
                { month: "August", events: "Independence Day Celebration" },
                { month: "September", events: "Half-Yearly Exams Begin" },
                { month: "October", events: "Dussehra Break / Results" },
                { month: "November", events: "Diwali Vacation" },
